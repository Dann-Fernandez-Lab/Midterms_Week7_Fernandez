<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhazianne's Creatives</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #b0c2b9; 
            color: #2d4038;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

    
        header {
            background-color: #435b51;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px; 
        }

        .logo-group h3 {
            color: #ffffff;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center; 
            gap: 30px;
        }

        nav ul li a {
            color: #a4b3ac;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding-bottom: 5px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ffffff;
            border-bottom: 3px solid #f1c40f;
        }

        
        .main-workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;     
            padding: 40px 20px;
        }

       
        .content-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); /* Light frame drop shadow */
            max-width: 650px;
            width: 100%;
            text-align: center; /* Centralizes all interior text/headings internally */
        }

        .main-title {
            font-size: 2rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

   
    <header>
      
        <div class="logo-group">
            <img src="elementrx.png" alt="Logo" style="width: 50px; height: 50px;">
            <h3>JHAZIANNE'S CREATIVES</h3>
        </div>
        
    
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

   
    <div class="main-workspace">
       
        <main class="content-card">
            <h1 class="main-title">EXPERIENCE THE CREATIVE</h1>
        </main>
    </div>

</body>
</html>
